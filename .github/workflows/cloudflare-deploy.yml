name: Cloudflare deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Provision Cloudflare resources and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EARTH_SIGNAL_API_TOKEN: ${{ secrets.EARTH_SIGNAL_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$EARTH_SIGNAL_API_TOKEN" ]; then
            echo "::notice::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and EARTH_SIGNAL_API_TOKEN to repository Actions secrets to enable deployment."
            exit 0
          fi

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          echo "Checking D1 database..."
          databases=$(curl --fail-with-body --silent --show-error "$api/d1/database?per_page=100" "${auth[@]}")
          database_id=$(jq -r '.result[]? | select(.name == "earth-signal-db") | .uuid' <<< "$databases" | head -n1)
          if [ -z "$database_id" ]; then
            created=$(curl --fail-with-body --silent --show-error -X POST "$api/d1/database" "${auth[@]}" --data '{"name":"earth-signal-db"}')
            database_id=$(jq -r '.result.uuid // empty' <<< "$created")
          fi
          if [ -z "$database_id" ]; then
            echo "::error::Could not create or find the EARTH SIGNAL D1 database."
            exit 1
          fi

          echo "Checking R2 bucket..."
          buckets=$(curl --fail-with-body --silent --show-error "$api/r2/buckets" "${auth[@]}")
          bucket_exists=$(jq -r '[.result.buckets[]? | select(.name == "earth-signal-reports")] | length' <<< "$buckets")
          if [ "$bucket_exists" = "0" ]; then
            curl --fail-with-body --silent --show-error -X POST "$api/r2/buckets" "${auth[@]}" --data '{"name":"earth-signal-reports","location":"APAC"}' >/dev/null
          fi

          echo "Injecting account-specific D1 UUID into the deployment config..."
          DATABASE_ID="$database_id" node --input-type=module -e '
            import fs from "node:fs";
            const path = "wrangler.jsonc";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.d1_databases[0].database_id = process.env.DATABASE_ID;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

          echo "Applying D1 migrations..."
          npx --yes wrangler@latest d1 migrations apply earth-signal-db --remote

          echo "Uploading protected API token..."
          printf '%s' "$EARTH_SIGNAL_API_TOKEN" | npx --yes wrangler@latest secret put API_TOKEN

          echo "Deploying EARTH SIGNAL..."
          npx --yes wrangler@latest deploy
